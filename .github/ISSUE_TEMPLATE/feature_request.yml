name: Idea
description: Something you would like RimOxide to do.
labels: ["enhancement"]
body:
  - type: textarea
    id: want
    attributes:
      label: What you want to do
      description: Describe what you are trying to get done, not only the button you have in mind.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why the current way falls short
    validations:
      required: true
